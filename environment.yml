name: sp_process
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  # version pins below follow palom's requirements
  - numpy<2
  - scikit-image>=0.18,<0.20
  - tifffile<=2024.7.2
  - zarr>=2.17,<3  # tif_utils.py also uses zarr.hierarchy.Group (zarr v2 API)
  - pandas
  - dask
  - anndata
  - scanpy
  - leidenalg
  - python-igraph
  - matplotlib
  - seaborn
  - geopandas
  - shapely
  - opencv
  - lxml
  - pillow
  - loguru
  - tqdm
  - ipython
  - ipykernel
  - pyyaml
  - omegaconf>=2.4  # run_pipeline.py config; <2.4 register_resolver rejects the nested ${join:${channel_names}}
  # remaining palom dependencies
  - imagecodecs
  - scikit-learn
  - fire
  - pint
  - ome-types
  - yamale
  - openslide-python
  - pip
  - pip:
      - palom
      # cellpose pinned to commit a9f8bfc (PR #1423, "Gray saturation fix")
      - cellpose @ git+https://github.com/MouseLand/cellpose.git@a9f8bfcde43033247309e3982747df9fe9f09315
      - bbknn  # sc.external.pp.bbknn in sp_cell_type_clustering.py
